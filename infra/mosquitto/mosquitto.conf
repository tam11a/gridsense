# GridSense MQTT broker (Eclipse Mosquitto 2.x)
#
# Devices connect over plain MQTT on 1883. The dashboard connects over
# WebSockets on 9001, which is only reachable through the reverse proxy
# (wss://<domain>/mqtt), never published directly.
#
# Anonymous access is kept so existing device firmware keeps working.
# To require credentials, see infra/mosquitto/README.md.

per_listener_settings false
allow_anonymous true

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
